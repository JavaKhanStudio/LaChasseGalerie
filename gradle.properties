org.gradle.daemon=true
org.gradle.jvmargs=-Xms128m -Xmx1500m
org.gradle.configuration-cache=true

gdxVersion=1.14.2
gdxControllersVersion=2.2.4
# libGDX 1.14.2 ships LWJGL 3.3.3, which does not recognise the JNI version of Java 24+.
lwjglVersion=3.3.6
# The parallax background library (JKS_Tools2D_ParallaxBackground), from Maven Central.
# A fix not released yet comes as a snapshot: pin its timestamped build (2.5.0-20260926.092334-1,
# never X.Y.Z-SNAPSHOT) and add maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
# to the root build.gradle's repositories. Central drops snapshot builds after 90 days.
# How: JKS_Tools2D_ParallaxBackground/RELEASING.md, 'Test versions (snapshots)'.
parallaxVersion=2.1.0
# WebRTC for the desktop host a browser tab joins (r46): the rtc module. Natives per platform.
webrtcVersion=0.18.0
# The html module's GWT compiler: the version gdx-backend-gwt $gdxVersion is built against.
gwtVersion=2.11.0
