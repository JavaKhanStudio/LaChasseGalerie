# The game's relay (r45, d6 -> relay): coturn, for the pairs whose punch fails
# (about one in ten, docs/online-multiplayer.md section 9). Only the joiner
# allocates; the host just sends to the relayed address like any other.
#
# It runs on VPS_1 beside Fountain of Dreams, whose services all listen on
# 127.0.0.1 and on docker's private networks. A TURN server forwards to any
# peer it is asked to, so every loopback, private, link-local and carrier
# range is DENIED below: without that, a relay allocation is a door into
# FoD's Postgres. Never remove one of these lines to "fix" a LAN test: test
# on a local coturn instead (deploy/relay/local.sh).
#
# The secret is not here. The compose file passes --static-auth-secret from
# the box's .env, and the lobby service mints short-lived credentials with
# it (TURN REST: user = expiry:name, password = base64 HMAC-SHA1).

listening-port=3478
# Relayed addresses come from this range: 240 allocations at once, and
# total-quota below keeps it well under that.
min-port=49160
max-port=49400

realm=lachassegalerie
use-auth-secret
fingerprint
stale-nonce=600

# Players' game traffic only: UDP relays, no TCP, no TLS, no admin CLI.
no-tcp-relay
no-tls
no-dtls
no-cli
no-multicast-peers

# Budgets: a relayed session is ~0.5 Mbit/s each way (9 kB/s per client,
# 64 kB/s for a full host), so 128 kB/s per allocation is double that, and
# the whole relay stops at 4 MB/s (32 Mbit/s) so it can never starve FoD.
max-bps=131072
bps-capacity=4194304
user-quota=4
total-quota=64

# Peers it must never forward to (RFC 6890 special-purpose ranges).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# The relay's own box: its public side too (a loop through two allocations).
# RELAY_PUBLIC_IP is set by deploy.sh; a local coturn has none.
