# The page's server (r83). GWT's *.nocache.js must never be cached (it names
# the permutation to load); its *.cache.js are content-hashed, cached for good.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    gzip on;
    gzip_types application/javascript text/css application/json text/plain;
    location = / { return 302 /index.html; }
    location ~ \.nocache\.js$ { add_header Cache-Control "no-cache"; }
    location = /play { return 301 /play/; }
    location /play/ { gzip off; }
    location ~ \.cache\.js$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
