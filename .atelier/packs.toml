# lachassegalerie's TAGS AND THEIR CONTEXT PACKS — read by Atelier (projects/lachassegalerie.toml says
# packs = ".atelier/packs.toml"). A pack is what a session reads BEFORE the code it describes, so
# when a change makes one wrong, fix it here IN THE SAME COMMIT. Only [tags.<slug>]
# tables belong in this file: label, description, context, color, sort.

[tags.gameplay]
label = "Gameplay"
description = "The run's timeline, spawns, heroes, monsters, the axe, potions, score"
color = "#ff7070"
sort = 10
context = """
core/src/jks/story/GVars_Story.java is the whole run: music at 10s, monsters from 15s,
take-off at 37s, stabilise at 45s, all static timers.
A RUN TEARS DOWN (3630376, phase 0.4): Vue_Game.dispose, called by GVars_Heart.changeVue, disposes
the Box2D world whole and drops lists, queues, HUD Stage, batch, canoe, star and players; what a
run changes that init did not undo is reset where the run STARTS (GVars_Story.init rewinds the
clock, timers and music cue; camera river speed back to 7.5; Index_Sprite hands every colour back;
setPages rewinds the river's static Enum_ColdNight pages). ADD A STATIC THAT A RUN MUTATES AND YOU
OWE IT A RESET THERE — smoke plays the seed twice in one JVM and fails if run 2 differs.
Nothing in the game yet ASKS to go back to the menu; a run never ends (the doubt on r34).
Monsters and potions scale with GVars_Game.heroes.size(): with nobody joined nothing
spawns.
core/src/jks/vars/GVars_Game.java (lists, spawning, addPlayer),
personnage/PhysicSpriteHeroes (move, double jump, hp, invulnerability, death),
PhysicSpriteEnnemy (chases a random hero), Weapon_AXE, physic/objects/PhysicSpriteHp, and
physic/MyContactListener, where every rule that fires on contact lives. The Box2D side of
all of these, meaning bodies, the destroy queue, contact dispatch and units, is #physics:
read it before removing or adding anything that has a body.
A hero being removed must null every enemy.target pointing at it (PhysicSpriteHeroes.kill
does); a monster stepping toward a destroyed body is the native crash ac3da1d fixed.
THE WORLD HAS A FIXED SIZE (053a6a4, phase 0.2): spawn points, the canoe, the spawners and the
parallax read GVars_Camera.viewWidth/viewHeight (1280x720, times worldMutiplier), and the camera
sits behind a FitViewport, so a bigger window only adds black bars. NEVER read
Gdx.graphics.getWidth()/getHeight() for a world position again — that is exactly what made a
1920x1200 run a different game. Only the HUD and the menu are laid out on the window.
EVERY DIE COMES FROM GVars_Random.random (fe08efc, phase 0.5), one seeded stream. Do not add a
`new Random()` anywhere: an unseeded roll breaks the smoke replay and a host's one start seed.
--debug is NOT the real game: Index_Sprite loads only 2 hero colours and 1 monster in
debug.
README.md's Controls and scoring paragraph (4 hearts, +1 per axe hit, potion heals or +2
at full health, death halves the score) is the documented rule set: change a rule, fix it
in the SAME commit.
Gates: `./gradlew smoke` (smoke/src/jks/smoke/Smoke_Run.java: 60s of the real loop headless
in about 1.5s, 3 players joining and dying, fails on a monster chasing a removed hero), then
PLAY it: `./gradlew :desktop:run --args=--mute`. The smoke stubs GL and cannot see anything
drawn.
"""

[tags.physics]
label = "Physics"
description = "The Box2D world: bodies, fixtures, contacts, the destroy queue, units, the fixed step"
color = "#9fa8ff"
sort = 15
context = """
core/src/jks/physic/: Gvars_Physic (the World, gravity from FVars_Physic, world.step),
MyContactListener, Enum_FictureType, tools/BoxBodyBuilder (circle bodies: monsters and the
axe), tools/RevoluteJoint (the hero-to-axe joint), objects/PhysicSpriteCanoe (static) and
PhysicSpriteHp. Hero bodies are built inside personnage/PhysicSpriteHeroes itself. The rules
that fire on contact are #gameplay.
NEVER DESTROY A BOX2D BODY OR JOINT WHERE IT IS FOUND. Queue it in
GVars_Game.toBeDestroy_Body / toBeDestroy_Jointure / toDie; Vue_Game.cleanUp() destroys
them before the next world.step. Those are LinkedHashSets on purpose: two contacts in one
step queue the same body twice, and a double destroy kills the JVM in native code — no
Java stack, only an hs_err_pid*.log in the working directory (desktop/assets for
:desktop:run, smoke/build/smoke for ./gradlew smoke).
A body must leave the game's list (heroes, ennemies, hpStack) in the same step it is
queued, or the next act() reads a destroyed body.
Contacts dispatch by fixture userData through Enum_FictureType.findIntence: the canoe is
the STRING "CANOE" (matched by toString()), everything else is `this`. A fixture with NO
userData is typed NONE silently; one holding an unknown class prints "IMPOSSIBLE DE TROUVER
INTANCE!". Either way every rule ignores it. Only PLAYER and AXE contacts do anything; add a
branch there or the new body never interacts.
THE WORLD HAS ITS OWN CLOCK, NOT THE FRAME'S (r23, commit in that ticket): Main_Game.render
accumulates real time and calls vue.update(FVars_Heart.step = 1/60) once per WHOLE step, at
most 5 in one frame; Gvars_Physic.act(delta) steps the world with exactly that. NEVER step the
world or advance a timer from Gdx.graphics.getDeltaTime() — that was the bug: at 30 fps the
world ran at half speed and at 144 fps at 1.5x, while the story clock kept real time. Anything
that must age with the game (animation stateTime included) belongs in act(delta), not in draw().
Velocities are still set as `speed * delta` with delta = one step, so the tuning is per 1/60:
change the step and jump height and speeds change with it.
Units: FVars_Physic.PPM = 100 px per metre, BUT BoxBodyBuilder has its own WORLD_TO_BOX =
0.01 for circle radii and the axe joint anchors: change PPM and those two stay behind.
CreateCircleBody sets gravityScale 0, so monsters and axes do not fall. GVars_Camera.
worldMutiplier = 2 makes the sprite world twice the WINDOW's pixels.
./gradlew smoke checks, every frame, that world.getBodyCount() equals canoe + 2 per hero +
monsters + potions + the destroy queue, and getJointCount() equals heroes + the joint
queue. A NEW KIND OF BODY fails that check until Smoke_Run.checkInvariants counts it:
extend the check, do not loosen it.
Gates: `./gradlew build`, `./gradlew smoke` (it catches a double destroy before the native
crash: a scratch copy that kept the destroy queue failed at frame 194), then PLAY it:
`./gradlew :desktop:run --args=--mute`.
"""

[tags.input]
label = "Input & players"
description = "Joining, keyboard and gamepads, controller mappings"
color = "#6ee787"
sort = 20
context = """
core/src/jks/input/: IKM_Game_Keyboard (the one keyboard player), IKM_Game_XBoxController
(every gamepad, despite its name), Utils_Controller (stick thresholds), Player_Inputs
(flags consumed once per frame in act), PlayerId, GVars_Controller.
A PLAYER IS A PlayerId, NOT A Controller (081f992, phase 0.3): GVars_Controller.playerList and
GVars_Game.playerRegister are TreeMaps on PlayerId, and PhysicSpriteHeroes carries its PlayerId.
A remote player has no Controller, so never key anything about a player on one again. A device
(null = the keyboard, still) reaches its player only through GVars_Controller.identify /
getLocalPlayer, used by the input edge, Menu_Picker and the smoke. Offline, identify mints one
PlayerId per device in join order and a device keeps it across deaths, so a label follows its pad.
The first key or button press only JOINS (GVars_Game.addPlayer) and returns without
acting; pressing after death joins again under the same PlayerId and ScoreLabel.
Buttons go through controller.getMapping() (buttonA/B/X, axisLeftX/Y) — ac3da1d replaced
the hard-coded Xbox codes. Never compare raw button numbers again; they differ per pad and
per OS. Vue_Game.init calls Controllers.clearListeners() before adding its listener.
Swing keys look swapped and are documented that way: D swings LEFT, Q swings RIGHT;
gamepad B left, X right. README.md's Controls table is the contract — change a binding,
fix the table in the SAME commit.
keyUp only releases LEFT/RIGHT; everything else is a one-shot flag cleared in
Player_Inputs.act. GVars_Game.inCinematic swallows input but nothing ever sets it true.
The input processor is an InputMultiplexer with the HUD Stage FIRST: a scene2d actor that
handles key events will eat the join key before IKM_Game_Keyboard sees it.
Gate: `./gradlew :desktop:run --args=--mute`, join from the keyboard AND a gamepad, die,
rejoin.
"""

[tags.background]
label = "Parallax background"
description = "The night river scene and the parallax-background library it draws with"
color = "#e879f9"
sort = 30
context = """
The scene is built IN JAVA, not from .plax files: core/src/jks/parralax/ColdNightModel.java
declares every layer (region name + regionPosition, sizeRatio, parallax ratios, drift speed,
start pads) and Enum_ColdNight wraps two lists of them into COLD_NIGHT and COLD_WATER. That
package is three files. Atlas desktop/assets/parralax/models/OneNight.atlas: a layer picks its
image by region NAME + regionPosition among same-named regions.
THE LIBRARY IS A DEPENDENCY, NOT A COPY IN THIS REPO: io.github.javakhanstudio:parallax-background
(core/build.gradle, parallaxVersion in gradle.properties). ad38949 deleted the vendored
core/src/jks/tools2d/parallax, so there is nothing here to diff against upstream any more. Its
source is the Parallax board — project 'parallax', /home/simon/Documents/GitHub/parralax.
TWO HEARTS, ONE SCENE: GVars_Parralax.background (COLD_NIGHT) and .foreground (COLD_WATER).
Vue_Game.render draws background, then canoe back / heroes / monsters / potions / canoe front,
then foreground — so the foreground's water and clouds pass IN FRONT of the heroes on purpose.
Moving a layer between the two lists moves it across the characters.
NOTHING MOVES A CAMERA. GVars_Parralax.scroll(delta, moveX, moveY) adds move/delta into both
hearts' screenSpeedConsumableX/Y; Parallax_Heart.act(delta) spends that and zeroes it. So you
pass the distance for THIS frame and it must be followed by act() in the same frame. Vue_Game
passes GVars_Camera.screenMovementSpeed as moveX — a distance per FRAME, not per second — and
GVars_Story adds delta*flyingSpeed vertically during take-off. "Faster river" is that number.
THE TRAP THAT FAILS SILENTLY: ColdNightModel.layer() converts the start pads with
Gvars_Parallax.getWorldHeight()/getWorldWidth(), read when Enum_ColdNight is FIRST TOUCHED.
That static pair defaults to 40x40 (javap on the 2.1.0 jar's static initialiser) and only the
Parallax_Heart constructor in GVars_Parralax.init sets the real 40x22.5. Touch the enum before
init and every horizontal pad is 1.78x too large, with no error anywhere. Vue_Game.init has the
order right: GVars_Heart.init() first, setPages() after. That size is JVM-wide, so both hearts
must keep the same one (parallax r27).
ColdNightModel's numbers are EXACT conversions of the old library's (decal_X = pad_X*100*H/W,
speedXAtRest = -speed/ratio, r9 handoff), not approximations. Do not re-tune them.
Gate: `./gradlew :desktop:run --args=--mute` and LOOK — past 37s for the take-off.
"""

[tags.hud]
label = "HUD"
description = "The scene2d score table, skin and debug FPS overlay"
color = "#ff9f43"
sort = 40
context = """
core/src/jks/vinterface/GVars_Interface.java (the Stage, the skin, the bottomScore table),
personnage/ScoreLabel.java (one player's name, score and deaths),
vinterface/Utils_Interface (texture -> drawable), debug/ShowFPS (only with --debug).
Skin: desktop/assets/skin/freezing-ui.json + .atlas, which loads font-export.fnt,
font-button-export.fnt and font-title-export.fnt — all three are needed. Icons:
ui/score.png, ui/death.png, tinted per player with the hero's colour in
ScoreLabel.setColor.
Every size is computed ONCE in GVars_Interface.init from Gdx.graphics: the table is 70% x
12% of the window and ScoreLabel.buttonSize is a static Float set there. A ScoreLabel
built before init unboxes a null Float and NPEs; nothing recomputes on another resolution.
ScoreLabel's widgets override getPrefWidth/getPrefHeight in anonymous subclasses — that,
not the skin, is what sizes the icons. Label text is "   Player N   " with the padding in
the string. The Stage is FIRST in the InputMultiplexer (Vue_Game.init): a HUD actor that
handles keys eats the join key.
The HUD draws after both parallax pages; hearts over a hero are NOT HUD — they are
PhysicSpriteHeroes.drawHp, in the sprite batch (#gameplay).
ASCII ONLY, AND IT FAILS SILENTLY: all three .fnt files carry 98 glyphs. No accented letter and
no dash but '-'. An em dash drew as a BLANK in r18's first menu render; 'Créer une partie' would
lose its e the same way. Either stay in ASCII or re-export the fonts.
A SECOND VIEW EXISTS NOW (r18, Vue_Menu, behind --menu): it builds its OWN Stage, because
GVars_Interface.init unconditionally puts the score table on the shared one. Widgets outside the
game go through GVars_Interface.loadSkin(), which gives the skin without the HUD.
ITS BUTTONS ARE NOT THE MOUSE'S ALONE (d8, r28): each one is a choice in a
jks.vinterface.Menu_Focus ring, which the pointer, IKM_Menu_Keyboard (arrows, Space, Enter) and
IKM_Menu_XBoxController (left stick, d-pad, A) all move and pick. Add a choice with
focus.add(button, action), NOT with a ChangeListener of its own, and leave a choice nobody can
take out of the ring. The focused one is drawn with the style's 'down' background, unfocused ones
at alpha 0.85, a disabled one at 0.6. A pick does NOT run where it is triggered: Menu_Focus holds
it until the view's next update, because changeVue inside a scene2d or a gdx-controllers callback
disposes the very thing being iterated. A pick also carries WHO made it (d9, r52): a Menu_Picker -
a pad, the keyboard, or a pointer that is nobody - which Vue_Game takes in its constructor and
joins as player 1 at the END of init. Anything that opens a run from a menu must pass one, and
anything that joins a player must come after GVars_Interface.init and the canoe.
Gate: `./gradlew :desktop:run --args=--mute`, join two players, and look at it windowed
AND with --fullscreen.
"""

