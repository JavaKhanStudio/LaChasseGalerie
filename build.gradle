// offscreen(task, when): windows nobody is meant to watch go to a headless display.
apply from: 'gradle/offscreen.gradle'

subprojects {
    apply plugin: 'java'

    version = '1.0'

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }
}
