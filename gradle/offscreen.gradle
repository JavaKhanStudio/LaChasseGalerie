// Offscreen by default: windows nobody is meant to watch get a display of their own.
//
// Copied from the Atelier skill run-offscreen (skills/run-offscreen/offscreen.gradle). Change
// it there first when the change is not about this project, so every game gets the fix.
//
// A board agent checking its work runs the game, and the GL tests each open a real window to
// get a GPU surface. Nobody is watching either one, yet they opened on Simon's desktop in front
// of whatever he was doing, with the music coming out of his speakers. Here the build keeps
// them off it by itself, so nobody has to remember a wrapper.
//
// One cage (a headless wlroots compositor) is started per build, the first time a task asks
// for it, and closed when the build ends, including a failed one. The task's JVM is pointed at
// it through WAYLAND_DISPLAY and DISPLAY, so rendering keeps the GPU.
//
//   apply from: 'gradle/offscreen.gradle'          in the root build.gradle, then:
//   rootProject.offscreen(task, 'always')          GL tests: nobody ever watches those
//   rootProject.offscreen(task, 'unattended')      run tasks: offscreen for a board agent
//                                                  (ATELIER_AGENT set); on the screen for
//                                                  anyone else, including the board's own
//                                                  "Play it" buttons
//
// ATELIER_NO_OFFSCREEN=1 puts the windows back when you want to watch, and the sound with
// them; ATELIER_OFFSCREEN=1 sends an 'unattended' task offscreen for you too. Without cage
// (Windows, macOS, a Linux machine that lacks it) everything opens on the screen as it always
// did, but the sound still goes to a file.
//
// Everything is a class rather than a script closure so that it works with the configuration
// cache, which cannot store a reference back into a build script.

import java.util.concurrent.CompletableFuture
import java.util.concurrent.TimeUnit

import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters
import org.gradle.process.ProcessForkOptions

abstract class AtelierOffscreenDisplay implements BuildService<BuildServiceParameters.None>, AutoCloseable
{
	private Process cage
	private Map<String, String> display
	private String failure

	/**
	 * WAYLAND_DISPLAY and DISPLAY of a headless cage, started on first use. Null when there
	 * is no cage to start; throws when cage exists but will not come up, because quietly
	 * falling back to the real screen is exactly what this is here to stop.
	 */
	synchronized Map<String, String> display()
	{
		if (failure != null) throw new GradleException(failure)
		if (cage != null) return display

		// cage runs one client and exits with it. This client prints the display cage made
		// for it and then waits on stdin, so cage lives until close() hangs up - or until the
		// Gradle daemon dies, which closes the pipe just the same. Nothing is left behind.
		ProcessBuilder pb = new ProcessBuilder('cage', '--', 'sh', '-c',
			'printf "%s|%s\\n" "$WAYLAND_DISPLAY" "$DISPLAY"; exec cat >/dev/null')
		pb.environment().put('WLR_BACKENDS', 'headless')   // no output, nothing on screen
		pb.redirectError(ProcessBuilder.Redirect.DISCARD)
		try
		{
			cage = pb.start()
		}
		catch (IOException ignored)
		{
			return null   // cage is not installed
		}

		BufferedReader out = new BufferedReader(new InputStreamReader(cage.inputStream))
		String line = null
		try
		{
			line = CompletableFuture.supplyAsync { out.readLine() }.get(15, TimeUnit.SECONDS)
		}
		catch (Exception ignored) {}

		String[] parts = line?.split('\\|', -1)
		if (parts == null || parts.length != 2 || !parts[0] || !parts[1])
		{
			close()
			failure = 'cage is installed but did not start a headless display (got ' + line + '). ' +
				'Set ATELIER_NO_OFFSCREEN=1 to open the windows on your screen instead.'
			throw new GradleException(failure)
		}
		display = [WAYLAND_DISPLAY: parts[0], DISPLAY: parts[1]]
		return display
	}

	@Override
	void close()
	{
		if (cage == null) return
		try { cage.outputStream.close() } catch (IOException ignored) {}
		if (!cage.waitFor(5, TimeUnit.SECONDS)) cage.destroyForcibly()
	}
}

class AtelierOffscreenAction implements Action<Task>
{
	Provider<AtelierOffscreenDisplay> service
	String when
	File audioDir

	@Override
	void execute(Task task)
	{
		ProcessForkOptions fork = (ProcessForkOptions) task   // JavaExec, Test, Exec
		Map<String, String> env = System.getenv()
		if (env.ATELIER_NO_OFFSCREEN == '1') return   // watching, and listening
		if (when == 'unattended' && !env.ATELIER_AGENT && env.ATELIER_OFFSCREEN != '1') return

		captureAudio(task, fork)

		if (env.ATELIER_INSIDE_CAGE == '1') return   // offscreen.sh already put us in one
		if (!System.getProperty('os.name').toLowerCase().contains('linux')) return

		Map<String, String> display = service.get().display()
		if (display == null)
		{
			task.logger.warn("offscreen: cage not found, so ${task.path} opens its windows on your screen")
			return
		}
		fork.environment(display)
		task.logger.lifecycle("offscreen: ${task.path} renders to a headless display " +
			"(cage, ${display.WAYLAND_DISPLAY} / ${display.DISPLAY}); ATELIER_NO_OFFSCREEN=1 to watch")
	}

	// Nobody is listening either. LWJGL ships OpenAL Soft, which takes its output from the
	// environment: ALSOFT_DRIVERS=wave is a real playback device, running in real time, that
	// writes a WAV file instead of reaching the sound card. The app hears nothing different -
	// music plays, isPlaying() answers as it would - and what it played is left in
	// build/audio/<task>.wav, where a test can check it and an agent can hand it back
	// (`atelier attach`). The path is in ATELIER_AUDIO_CAPTURE. It works on every OS.
	//
	// It has to be set on the TASK: a forked JVM takes the daemon's environment, not the shell's.
	// A file per task, overwritten each run: about 10 MB a minute of play. A run that is killed
	// rather than quit leaves the WAV header claiming a wrong length; read to the end of file.
	private void captureAudio(Task task, ProcessForkOptions fork)
	{
		audioDir.mkdirs()
		File wav = new File(audioDir, "${task.name}.wav")
		File conf = new File(audioDir, "${task.name}.alsoft.conf")
		// 16-bit stereo, so the file is simple to read back; the backend's default is float.
		conf.text = "# Written by gradle/offscreen.gradle for ${task.path}.\n" +
			"[general]\nsample-type = int16\nchannels = stereo\nfrequency = 44100\n\n" +
			"[wave]\nfile = ${wav.absolutePath}\n"
		fork.environment(ALSOFT_DRIVERS: 'wave', ALSOFT_CONF: conf.absolutePath,
			ATELIER_AUDIO_CAPTURE: wav.absolutePath)
		task.logger.lifecycle("offscreen: ${task.path} plays its sound into ${wav} rather than your speakers")
	}
}

def atelierOffscreenDisplay = gradle.sharedServices.registerIfAbsent('atelierOffscreenDisplay', AtelierOffscreenDisplay) {}

ext.offscreen = { Task task, String when ->
	task.usesService(atelierOffscreenDisplay)
	task.doFirst(new AtelierOffscreenAction(
		service: atelierOffscreenDisplay,
		when: when,
		audioDir: task.project.layout.buildDirectory.dir('audio').get().asFile))
}
