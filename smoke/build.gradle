// ./gradlew smoke : plays the real game loop headless for a minute of game time, with players
// joining, fighting and dying, and fails on the first broken invariant or native crash.
// Not part of build (Simon's choice on r4): build only compiles it.

sourceSets.main.java.srcDirs = ['src']

dependencies {
    // The headless loop itself lives in :headless; this module is the scripted players and the checks
    implementation project(':headless')
}

tasks.register('smoke', JavaExec) {
    group = 'verification'
    description = 'Plays 60s of the game loop headless with joining and dying players, twice in one JVM.'
    mainClass = 'jks.smoke.Smoke_Run'
    classpath = sourceSets.main.runtimeClasspath
    // The game loads its textures and atlases by relative path
    workingDir = rootProject.file('desktop/assets')
    def crashLog = layout.buildDirectory.file('smoke/hs_err_pid%p.log').get().asFile
    // A Box2D crash kills the JVM with no Java stack: keep its log out of the assets
    jvmArgs '--enable-native-access=ALL-UNNAMED', "-XX:ErrorFile=$crashLog"
    // ./gradlew smoke -Pseed=42 -Pseconds=120 -Pruns=3 : every run after the first goes back to the menu and replays the seed
    args providers.gradleProperty('seed').orElse('1').get(), providers.gradleProperty('seconds').orElse('60').get(), providers.gradleProperty('runs').orElse('2').get()
}

// ./gradlew nettest : holds jks.net to its contract over real UDP on loopback and over the
// in-memory wire. No window, no game, no assets — a couple of seconds.
tasks.register('nettest', JavaExec) {
    group = 'verification'
    description = 'Checks the transport seam: round trips, the MTU cap, unknown peers, loss, timeouts.'
    mainClass = 'jks.smoke.Net_Run'
    classpath = sourceSets.main.runtimeClasspath
}
