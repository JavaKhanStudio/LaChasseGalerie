// ./gradlew smoke : plays the real game loop headless for a minute of game time, with players
// joining, fighting and dying, and fails on the first broken invariant or native crash.
// Not part of build (Simon's choice on r4): build only compiles it.

sourceSets.main.java.srcDirs = ['src']

dependencies {
    // The headless loop itself lives in :headless; this module is the scripted players and the checks
    implementation project(':headless')
    // A browser tab's transport, desktop side (r46) : nettest's rtc/* checks
    implementation project(':rtc')
}

tasks.register('smoke', JavaExec) {
    group = 'verification'
    description = 'Plays 60s of the game loop headless with joining and dying players, twice in one JVM.'
    mainClass = 'jks.smoke.Smoke_Run'
    classpath = sourceSets.main.runtimeClasspath
    // The game loads its textures and atlases by relative path
    workingDir = rootProject.file('desktop/assets')
    def crashLog = layout.buildDirectory.file('smoke/hs_err_pid%p.log').get().asFile
    // A Box2D crash kills the JVM with no Java stack: keep its log out of the assets
    jvmArgs '--enable-native-access=ALL-UNNAMED', "-XX:ErrorFile=$crashLog"
    // ./gradlew smoke -Pseed=42 -Pseconds=120 -Pruns=3 : every run after the first goes back to the menu and replays the seed
    args providers.gradleProperty('seed').orElse('1').get(), providers.gradleProperty('seconds').orElse('60').get(), providers.gradleProperty('runs').orElse('2').get()
}

// ./gradlew nettest : holds jks.net and jks.online to their contracts over real UDP on loopback and
// over the in-memory wire, with a toy world behind the host (no window, no game, a couple of seconds),
// THEN plays the sessions for real : netsession (the game headless behind a host, clients in the same
// JVM) and netprocs (a host JVM and two client JVMs over UDP). About 15 s in all.
tasks.register('nettest', JavaExec) {
    group = 'verification'
    description = 'Checks the transport, codec, mirror and session rules, then plays host and clients in one JVM and across three.'
    mainClass = 'jks.smoke.Net_Run'
    classpath = sourceSets.main.runtimeClasspath
    // The rtc/* checks load libwebrtc's natives
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // -Ponly=tab/ : only the checks whose name starts so (the process gates after it still run)
    systemProperty 'net.only', providers.gradleProperty('only').orElse('').get()
    finalizedBy 'netsession', 'netending', 'netprocs', 'netlobby', 'nettab'
}

// ./gradlew netcensus : how big a snapshot the real game makes. Plays the headless loop with 8
// players and encodes the snapshot a host would send every tick; fails if one passes 1200 B.
// ./gradlew netcensus -Pplayers=8 -Pseconds=600 -Pseed=2
tasks.register('netcensus', JavaExec) {
    group = 'verification'
    description = 'Measures the biggest snapshot an N-player headless run makes, against the payload cap.'
    mainClass = 'jks.smoke.Net_Census'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.file('desktop/assets')
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args providers.gradleProperty('players').orElse('8').get(), providers.gradleProperty('seconds').orElse('120').get(), providers.gradleProperty('seed').orElse('1').get()
}

// ./gradlew netmirror : phase 1.3's gate. A headless host reads its world into a snapshot every tick
// and world-less clients apply it, exactly and through the codec; fails on the first entity they
// disagree on. ./gradlew netmirror -Pplayers=8 -Pseconds=90 -Pseed=1
tasks.register('netmirror', JavaExec) {
    group = 'verification'
    description = 'Applies every tick of a headless run to world-less clients and checks they agree with the world.'
    mainClass = 'jks.smoke.Net_Mirror'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.file('desktop/assets')
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args providers.gradleProperty('players').orElse('8').get(), providers.gradleProperty('seconds').orElse('90').get(), providers.gradleProperty('seed').orElse('1').get()
}

// ./gradlew netnat : this machine's network as the game sees it, against the real public STUN servers (r42).
// Needs the internet, so it is not in nettest. Run it on the network you want to know about.
tasks.register('netnat', JavaExec) {
    group = 'verification'
    description = 'Probes the public STUN servers from one socket and prints the NAT verdict and the advice a lobby would show.'
    mainClass = 'jks.smoke.Net_Nat'
    classpath = sourceSets.main.runtimeClasspath
}

// ./gradlew netrelay : the relay client through a REAL relay, two sockets on this machine (r45). Needs the
// internet and RELAY, RELAY_USER, RELAY_PASS in the environment : deploy/relay/netrelay.sh mints them on VPS_1.
tasks.register('netrelay', JavaExec) {
    group = 'verification'
    description = 'Allocates on a real TURN relay and sends the biggest packets both ways through it.'
    mainClass = 'jks.smoke.Net_Relay'
    classpath = sourceSets.main.runtimeClasspath
}

// ./gradlew netonline -Plobby=ip:port : the online path through the REAL lobby service and relay (r45), a host
// and a joiner held to the relay on this machine. Needs the internet; the default is VPS_1's service.
tasks.register('netonline', JavaExec) {
    group = 'verification'
    description = 'Hosts and joins through a real lobby service, the joiner through its relay, and sends game packets both ways.'
    mainClass = 'jks.smoke.Net_Online'
    classpath = sourceSets.main.runtimeClasspath
    args providers.gradleProperty('lobby').orElse('141.94.115.201:7770').get()
}

// ./gradlew netwsonline -Plobby=ip:port -Pws=ip:port : a tab's signalling through the REAL lobby service (r79) : a
// java.net.http WebSocket on its front offers 3 kB to a UDP host and gets the answer back. Needs the internet.
tasks.register('netwsonline', JavaExec) {
    group = 'verification'
    description = 'A WebSocket tab and a UDP host signal through a real lobby service: browse, join, offer, answer.'
    mainClass = 'jks.smoke.Net_Tab_Online'
    classpath = sourceSets.main.runtimeClasspath
    args providers.gradleProperty('lobby').orElse('141.94.115.201:7770').get(), providers.gradleProperty('ws').orElse('141.94.115.201:7771').get()
}

// ./gradlew netsession : phase 1.4's in-process gate. The real game headless behind a HostSession with
// no hero of its own, three world-less ClientSessions over the in-memory wire with latency and loss;
// fails when a client draws an entity away from where the host had it. ./gradlew netsession -Pseconds=60 -Pseed=1
tasks.register('netsession', JavaExec) {
    group = 'verification'
    description = 'Plays a headless host and three clients in one JVM and checks the clients track the host.'
    mainClass = 'jks.smoke.Net_Session'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.file('desktop/assets')
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args providers.gradleProperty('seconds').orElse('60').get(), providers.gradleProperty('seed').orElse('1').get()
    mustRunAfter 'nettest'
}

// ./gradlew netending : d14's gate. A hosted run's song ends : the host waits on its score screen with two
// clients still in, starts a new run under the same session, and at the end of that one closes the server.
// Plays the long middle of each run without the wire, so about 15 s. ./gradlew netending -Pseed=2
tasks.register('netending', JavaExec) {
    group = 'verification'
    description = 'Plays a hosted run to its score screen, a new run, and closing the server, with two clients.'
    mainClass = 'jks.smoke.Net_Ending'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.file('desktop/assets')
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args providers.gradleProperty('seed').orElse('1').get()
    mustRunAfter 'nettest', 'netsession'
}

// ./gradlew netprocs : phase 1.4 across processes. A host JVM runs the game headless on a UDP port the
// OS picks; two client JVMs that never load the game join it over 127.0.0.1 in real time for 8 s.
tasks.register('netprocs', JavaExec) {
    group = 'verification'
    description = 'Plays a headless host JVM and two client JVMs over UDP on loopback, in real time.'
    mainClass = 'jks.smoke.Net_Procs'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.file('desktop/assets')
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // Real time on one machine : not while the in-process gate is using the CPU
    mustRunAfter 'nettest', 'netsession', 'netending'
}

// ./gradlew netlobby : phase 2.1 across processes (r41). netprocs, found through the lobby service : a
// service JVM on the lobby module's classpath (no libGDX), a host JVM that opens a lobby on the socket
// it plays on, and two client JVMs that know only the service and the code.
evaluationDependsOn(':lobby')
tasks.register('netlobby', JavaExec) {
    group = 'verification'
    description = 'Plays netprocs through a lobby service JVM: the clients find the host by code alone.'
    mainClass = 'jks.smoke.Net_Procs'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.file('desktop/assets')
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    def lobbyClasspath = project(':lobby').sourceSets.main.runtimeClasspath
    inputs.files(lobbyClasspath)
    doFirst { systemProperty 'lobby.classpath', lobbyClasspath.asPath }
    args 'lobby'
    mustRunAfter 'nettest', 'netsession', 'netprocs'
}

// ./gradlew nettab : a browser tab joins a desktop host (r80). A service JVM (lobby module, no libGDX), a host
// JVM whose lobby takes tabs, a UDP client JVM and a tab JVM (a Transport_Rtc offering through the service's
// WebSocket front) play one session ; then the host again WITHOUT libwebrtc's natives, as a dist built on
// another platform : it plays the UDP client and leaves the tab unanswered.
tasks.register('nettab', JavaExec) {
    group = 'verification'
    description = 'Plays a host JVM with a UDP client JVM and a WebRTC tab JVM through a lobby service, then with no WebRTC natives.'
    mainClass = 'jks.smoke.Net_Procs'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.file('desktop/assets')
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    def lobbyClasspath = project(':lobby').sourceSets.main.runtimeClasspath
    inputs.files(lobbyClasspath)
    doFirst { systemProperty 'lobby.classpath', lobbyClasspath.asPath }
    args 'tab-gate'
    mustRunAfter 'nettest', 'netsession', 'netprocs', 'netlobby'
}
